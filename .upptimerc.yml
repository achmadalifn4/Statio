# Change these first
owner: achmadalifn4 # Your GitHub organization or username, where this repository lives
repo: Statio # The name of this repository

sites:
  - name: Google
    url: https://www.google.com
  - name: Wikipedia
    url: https://en.wikipedia.org
  - name: Hacker News
    url: https://news.ycombinator.com
  - name: Secret Site
    url: $SECRET_SITE

status-website:
  # Add your custom domain name, or remove the `cname` line if you don't have a domain
  # Uncomment the `baseUrl` line if you don't have a custom domain and add your repo name there
  # cname: your-custom-domain.com
  baseUrl: /Statio
  logoUrl: https://raw.githubusercontent.com/upptime/upptime.js.org/master/static/img/icon.svg
  name: Statio
  introTitle: "**Statio** is an uptime monitor and status page, powered entirely by GitHub Actions."
  introMessage: This status page uses **real-time** data from our [GitHub repository](https://github.com/achmadalifn4/Statio). No server required — just GitHub Actions, Issues, and Pages. Powered by [Upptime](https://upptime.js.org).
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO

# Upptime also supports notifications, assigning issues, and more
# See https://upptime.js.org/docs/configuration
